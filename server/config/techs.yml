        stats:
          - food: 1
      - tile_type: citrus_plantation
        stats:
          - food: 1
      - tile_type: cotton_plantation
        stats:
          - food: 1
      - tile_type: olive_plantation
        stats:
          - food: 1
      - tile_type: improved_horses
        stats:
          - food: 1
      - tile_type: improved_cattle
        stats:
          - food: 1
      - tile_type: improved_sheep
        stats:
          - food: 1
