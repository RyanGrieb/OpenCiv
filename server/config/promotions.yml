# Civ 5 (Brave New World) promotions, which units earn with experience (see server/src/unit/UnitPromotions.ts).
#
# classes: the unit classes (units.yml's unit_class) that can take it. fighter, bomber, helicopter and carrier
#   are listed for Civ 5's air units, helicopters and carriers, which aren't in the game yet.
# requires: promotions the unit must already have one of. Absent means none. requires_by_class replaces
#   that list for the classes it names (Civ 5's helicopters take Ambush I with no prerequisite).
# display_name: what the player sees, when two promotions share a name (the land and air Range).
# description: the tooltip text.
# not_yet: what the promotion does that needs systems the game doesn't have yet (air units, raiding gold).
# Each promotion's icon is PROMOTION_ plus its name in capitals, e.g. PROMOTION_SHOCK_I.
#
# effects (percentages are Combat Strength):
#   open_terrain_percent / rough_terrain_percent: fighting over a tile without / with hills, forest or jungle
#     (the defender's tile, whichever side the unit is on). Rough is Civ 5's hills, forest and jungle.
#   ranged_open_percent / ranged_rough_percent: the same, only for this unit's ranged attacks.
#   vs_classes: { classes, percent } against units of those classes, attacking or defending.
#   vs_wounded_percent, vs_city_percent, vs_fortified_percent, vs_land_percent, vs_naval_percent: when attacking.
#   naval_melee_percent: melee attacks against ships. attack_percent / defense_percent: every attack / defense.
#   ranged_defense_percent: defending against ranged attacks and city strikes.
#   extra_attacks, movement, sight, range: added to the unit's own.
#   heal_every_turn: heals at every turn's start even if it moved or fought, fortified or not.
#   heal_adjacent: extra healing for this unit and every friendly unit next to it (the best Medic counts).
#   heal_outside_friendly: extra healing outside its owner's borders.
#   woodsman: forest and jungle cost half the movement. amphibious: no penalty for attacking across a river.
#   indirect_fire: may shoot at anything its owner can see in range, line of sight or not.
#   withdraw: steps back from a melee attack when there's a free tile away from the attacker.
#   heal_instantly: heals this much and uses up the promotion it was picked as.
promotions:
  # Melee, gunpowder, mounted and armor.
  - name: Shock I
    classes: [melee, gunpowder, mounted, armor]
    description: +15% Combat Strength when fighting in open terrain (no Hills, Forest or Jungle)
    effects: { open_terrain_percent: 15 }
  - name: Shock II
    classes: [melee, gunpowder, mounted, armor]
    requires: [Shock I]
    description: +15% Combat Strength when fighting in open terrain (no Hills, Forest or Jungle)
    effects: { open_terrain_percent: 15 }
  - name: Shock III
    classes: [melee, gunpowder, mounted, armor]
    requires: [Shock II]
    description: +15% Combat Strength when fighting in open terrain (no Hills, Forest or Jungle)
    effects: { open_terrain_percent: 15 }
  - name: Drill I
    classes: [melee, gunpowder, mounted, armor]
    description: +15% Combat Strength when fighting in rough terrain (Hills, Forest or Jungle)
    effects: { rough_terrain_percent: 15 }
  - name: Drill II
    classes: [melee, gunpowder, mounted, armor]
    requires: [Drill I]
    description: +15% Combat Strength when fighting in rough terrain (Hills, Forest or Jungle)
    effects: { rough_terrain_percent: 15 }
  - name: Drill III
    classes: [melee, gunpowder, mounted, armor]
    requires: [Drill II]
    description: +15% Combat Strength when fighting in rough terrain (Hills, Forest or Jungle)
    effects: { rough_terrain_percent: 15 }
  - name: Formation I
    classes: [melee, gunpowder, mounted]
    requires: [Shock II, Drill II]
    description: +33% Combat Strength against mounted units
    effects: { vs_classes: { classes: [mounted], percent: 33 } }
  - name: Formation II
    classes: [melee, gunpowder, mounted]
    requires: [Formation I]
    description: +33% Combat Strength against mounted units
    effects: { vs_classes: { classes: [mounted], percent: 33 } }
  - name: Amphibious
    classes: [melee, gunpowder]
    requires: [Shock I, Drill I]
    description: No combat penalty for attacking across a river or from the sea
    effects: { amphibious: true }
  - name: Siege
    classes: [melee, gunpowder]
    requires: [Shock II, Drill II]
    description: +50% Combat Strength against cities
    effects: { vs_city_percent: 50 }
  - name: Charge
    classes: [mounted]
    requires: [Shock II, Drill II]
    description: +33% Combat Strength against wounded units
    effects: { vs_wounded_percent: 33 }
  - name: Blitz
    classes: [melee, gunpowder, mounted, armor]
    requires: [Shock III, Drill III]
    description: 1 additional attack per turn
    effects: { extra_attacks: 1 }
  - name: Woodsman
    classes: [melee, gunpowder]
    requires: [Shock III, Drill III]
    description: Double movement through Forest and Jungle
    effects: { woodsman: true }
  - name: Ambush I
    classes: [gunpowder, fighter, bomber, helicopter]
    requires: [Shock II, Drill II, Interception I, Dogfighting I, Siege I, Bombardment I]
    requires_by_class: { helicopter: [] }
    description: +25% Combat Strength against armored units
    effects: { vs_classes: { classes: [armor], percent: 25 } }
  - name: Ambush II
    classes: [gunpowder, fighter, bomber, helicopter]
    requires: [Ambush I]
    description: +25% Combat Strength against armored units
    effects: { vs_classes: { classes: [armor], percent: 25 } }
  - name: Medic
    classes: [melee, gunpowder, mounted, recon]
    requires: [Shock I, Drill I, Scouting II, Survivalism II]
    description: This unit and every unit next to it heal 5 extra HP per turn
    effects: { heal_adjacent: 5 }
  - name: Medic II
    classes: [melee, gunpowder, mounted, recon]
    requires: [Medic]
    description: This unit and every unit next to it heal 5 more HP per turn, and this unit heals 5 extra HP outside friendly territory
    effects: { heal_adjacent: 5, heal_outside_friendly: 5 }
  - name: March
    classes: [melee, gunpowder, mounted, ranged, siege]
    requires: [Shock III, Drill III, Accuracy II, Barrage II]
    description: Heals every turn, even after moving or fighting
    effects: { heal_every_turn: true }
  - name: Repair
    classes: [armor, helicopter]
    requires: [Shock III, Drill III, Ambush II, Mobility II]
    description: Heals every turn, even after moving or fighting
    effects: { heal_every_turn: true }
  - name: Cover I
    classes: [melee, gunpowder, ranged, siege]
    description: +25% defense against ranged attacks
    effects: { ranged_defense_percent: 25 }
  - name: Cover II
    classes: [melee, gunpowder, ranged, siege]
