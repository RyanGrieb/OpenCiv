# combat_strength is Civ 5's melee Combat Strength: what the unit attacks with in melee and
# defends with against any attack. Units without it (civilians) can't fight at all.
# ranged_strength and range make a unit ranged (Civ 5's Ranged Combat Strength and Range): it shoots
# at enemies up to `range` tiles away that it has line of sight to, and takes no damage doing so.
# combat_strength is still what it defends with, and it can't melee attack.
# captured_as is what a civilian becomes when an enemy melee unit takes its tile (Civ 5 turns a
# captured Settler into a Worker, which is our Builder). Civilians without it are destroyed instead.
# unique_to makes a unit one civilization's unique unit, built by that civ in place of the unit named
# in replaces and by nobody else.
# domain: sea marks a ship: it only moves on water (and into its owner's coastal cities), and only
# coastal cities can build it. coast_only keeps a ship off deep ocean, like Civ 5's Trireme.
# obsolete_tech is Civ 5's ObsoleteTech: once it's researched, cities stop offering the unit and drop it
# from their production queues (units already on the map stay). Each is the tech that unlocks the unit it
# upgrades to.
# A city training a Settler stops growing: its spare food goes into production instead, as in Civ 5.
units:
