# combat_strength is Civ 5's melee Combat Strength: what the unit attacks with in melee and
# defends with against any attack. Units without it (civilians) can't fight at all.
# captured_as is what a civilian becomes when an enemy melee unit takes its tile (Civ 5 turns a
# captured Settler into a Worker, which is our Builder). Civilians without it are destroyed instead.
units:
  - name: Warrior
    combat_strength: 8
    attack_type: melee
    cost: 30
  - name: Scout
    combat_strength: 5
    attack_type: melee
    cost: 20
    default_move_distance: 3
    sight_range: 3
    ignores_terrain_cost: true
  - name: Settler
    is_utility: true
    captured_as: Builder
  - name: Archer
    combat_strength: 5
    attack_type: ranged
    cost: 40
    required_tech: Archery
  - name: Builder
    is_utility: true
    captured_as: Builder
    cost: 50
  - name: Caravan
    is_utility: true
    cost: 75
    required_tech: Animal Husbandry
  - name: Cargo Ship
    is_utility: true
    cost: 100
    required_tech: Sailing
  - name: Work Boat
    is_utility: true
    cost: 30
    required_tech: Sailing
  - name: Galley
    combat_strength: 10
    attack_type: naval
    cost: 45
    required_tech: Sailing
  - name: Spearman
    combat_strength: 11
    attack_type: melee
    cost: 56
    required_tech: Bronze Working
  - name: Chariot Archer
    combat_strength: 6
    attack_type: ranged
    cost: 56
    required_tech: The Wheel
  - name: Horseman
    combat_strength: 12
    attack_type: melee
    cost: 75
    default_move_distance: 3
    required_tech: Horseback Riding
  - name: Swordsman
    combat_strength: 14
    attack_type: melee
    cost: 75
    required_tech: Iron Working
  - name: Legion
    combat_strength: 17
    attack_type: melee
    cost: 75
    required_tech: Iron Working
  - name: Composite Bowman
    combat_strength: 7
    attack_type: ranged
    cost: 75
    required_tech: Construction
  - name: Catapult
    combat_strength: 7
    attack_type: siege
    cost: 75
    required_tech: Mathematics
  - name: Pikeman
    combat_strength: 16
    attack_type: melee
    cost: 90
    required_tech: Civil Service
  - name: Crossbowman
    combat_strength: 13
    attack_type: ranged
    cost: 120
    required_tech: Machinery
