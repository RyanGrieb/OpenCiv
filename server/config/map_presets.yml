      "S": [grass]
      "B": [shallow_ocean]
      "G": [shallow_ocean]
    units:
      "B": Work Boat
      "G": Trireme
    rows:
      - "O O O ~ ~ ~ ~ ~ O O O"
      - " O ~ ~ B ~ ~ ~ ~ ~ O O"
      - "O ~ ~ ~ t ~ e B ~ ~ O"
      - " ~ ~ ~ ~ f c ~ ~ G ~ O"
      - "g g p g g S w B ~ ~ O"
      - " g h g g g g ~ ~ ~ O O"
      - "g F g g h g g ~ ~ O O"
      - " g g F g g g ~ ~ O O O"
      - "g g F g g ~ ~ O O O O"

