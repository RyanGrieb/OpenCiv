# unique_to makes a building one civilization's unique building, built by that civ in place of the
# building named in replaces and by nobody else.
# maintenance is Civ 5's GoldMaintenance: gold the owner pays for the building every turn. Wonders and the
# Palace have none.
# is_wonder marks a great (world) wonder: one city in the whole world can have it, and once it's built
# every other city building it loses it from its queue. national_wonder marks a national wonder: one
# per civilization. Civ 5 has a national wonder need its building in every city; here it needs it in
# the city building the wonder (requires_building).
# Most wonder effects in Civ 5 lean on systems the game doesn't have yet (great people, policies,
# religion), so a wonder's stats are a flat stand-in; the comment above each says what the real one does.
# happiness adds to the owner's empire-wide happiness (see PlayerHappiness), wherever the building stands.
# coastal: only a city beside the sea can build it. requires_building: the city must have that one first.
# Buildings only give flat yields for now, so where Civ 5's effect is a percentage or per-tile bonus
# (University's +33% Science, Harbor's +1 Production on sea tiles) the stats are a flat stand-in.
buildings:
  - name: Palace
    asset_name: BUILDING_PALACE
    stats:
      - science: 3
      - production: 3
      - gold: 2
      - defense: 2
      - culture: 1
  - name: Monument
    asset_name: BUILDING_MONUMENT
    cost: 60
    maintenance: 1
    stats:
      - culture: 2
  - name: Amphitheater
    asset_name: BUILDING_AMPHITHEATER
    cost: 100
    maintenance: 1
    required_tech: Drama and Poetry
    stats:
      - culture: 3
  - name: Aqueduct
    asset_name: BUILDING_AQUEDUCT
    cost: 100
    maintenance: 1
    required_tech: Engineering
    stats: []
  - name: Bazaar
    asset_name: BUILDING_BAZAAR
    # Arabia's unique Market in Civ 5. Arabia isn't in the game yet, so nobody can build it.
    unique_to: Arabia
    replaces: Market
    cost: 100
    required_tech: Currency
    stats:
      - gold: 2
      - science: 2
  - name: Castle
